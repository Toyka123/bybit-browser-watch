<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сигнальный бот · Bybit Live</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        html, body { background-color: #0b0e11; color: #eaedf1; font-family: 'Manrope', 'JetBrains Mono', sans-serif; margin: 0; padding: 0; min-height: 100vh; }
        header { background-color: #12161c; border-bottom: 1px solid #1f2630; padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
        h1 { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; margin: 0; }
        h1 span { color: #f7a600; }
        .status-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; font-family: 'JetBrains Mono', monospace; background: #1f2630; padding: 6px 12px; border-radius: 6px; }
        .status-dot { width: 8px; height: 8px; background-color: #00b159; border-radius: 50%; box-shadow: 0 0 8px #00b159; }
        main { max-width: 1200px; margin: 24px auto; padding: 0 20px; box-sizing: border-box; }
        .control-panel { background-color: #12161c; border: 1px solid #1f2630; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .panel-header { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #848e9c; border-bottom: 1px solid #1f2630; padding-bottom: 12px; margin-bottom: 20px; }
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 12px; font-weight: 600; color: #848e9c; }
        select, input { background-color: #1f2630; color: #ffffff; border: 1px solid #2d3848; border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none; }
        select:focus, input:focus { border-color: #f7a600; }
        .btn-scan { background-color: #f7a600; color: #000000; font-weight: 700; border: none; border-radius: 8px; padding: 12px 24px; font-size: 14px; cursor: pointer; height: 42px; display: flex; align-items: center; justify-content: center; }
        .btn-scan:hover { background-color: #ffb81c; }
        .stats-bar { display: flex; gap: 40px; margin-top: 16px; font-size: 14px; font-family: 'JetBrains Mono', monospace; color: #848e9c; }
        .stats-bar span strong { color: #ffffff; }
        .signals-section { background-color: #12161c; border: 1px solid #1f2630; border-radius: 12px; padding: 24px; min-height: 300px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { color: #848e9c; font-weight: 600; padding: 12px 16px; border-bottom: 1px solid #1f2630; font-size: 12px; text-transform: uppercase; }
        td { padding: 16px; border-bottom: 1px solid #1f2630; font-family: 'JetBrains Mono', monospace; }
        tr:hover td { background-color: #161b22; }
        .side-buy { color: #00b159; font-weight: 700; background: rgba(0, 177, 89, 0.1); padding: 4px 8px; border-radius: 4px; }
        .side-sell { color: #ff3b30; font-weight: 700; background: rgba(255, 59, 48, 0.1); padding: 4px 8px; border-radius: 4px; }
        .no-signals { text-align: center; color: #848e9c; padding: 60px 0; }
    </style>
</head>
<body>
    <header>
        <h1>SIGNAL<span>·</span>BOT</h1>
        <div class="status-badge"><div class="status-dot"></div><span>Bybit · Live API</span></div>
    </header>
    <main>
        <section class="control-panel">
            <div class="panel-header">Настройки сканирования рынка</div>
            <div class="settings-grid">
                <div class="form-group">
                    <label>Таймфрейм</label>
                    <select id="timeframe">
                        <option value="5">5 Минут (M5)</option>
                        <option value="15" selected>15 Минут (M15)</option>
                        <option value="60">1 Час (H1)</option>
                    </select>
                </div>
                <div class="form-group"><label>Период RSI</label><input type="number" id="rsi-period" value="14"></div>
                <div class="form-group"><label>Быстрая EMA</label><input type="number" id="ema-fast" value="9"></div>
                <div class="form-group"><label>Медленная EMA</label><input type="number" id="ema-slow" value="21"></div>
                <button class="btn-scan" id="btn-action" onclick="toggleScanner()">Сканировать рынок</button>
            </div>
            <div class="stats-bar">
                <span>Проверено монет: <strong id="stats-scanned">0</strong> / <strong id="stats-total">0</strong></span>
                <span>Активных сигналов: <strong id="stats-signals">0</strong></span>
            </div>
        </section>
        <section class="signals-section">
            <div class="panel-header">Найденные сигналы в реальном времени</div>
            <table>
                <thead>
                    <tr><th>Время</th><th>Актив</th><th>Направление</th><th>Цена</th><th>RSI</th><th>EMA Статус</th></tr>
                </thead>
                <tbody id="signals-table-body"></tbody>
            </table>
            <div class="no-signals" id="empty-state">Сигналов пока нет. Нажмите «Сканировать рынок».</div>
        </section>
    </main>
    <script>
        let isScanning = false;
        const USDT_PAIRS = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XRPUSDT', 'ADAUSDT', 'AVAXUSDT', 'DOGEUSDT', 'DOTUSDT', 'LINKUSDT', 'LTCUSDT'];

        function calculateEMA(prices, period) {
            if (prices.length < period) return null;
            const k = 2 / (period + 1);
            let ema = prices[0];
            for (let i = 1; i < prices.length; i++) { ema = prices[i] * k + ema * (1 - k); }
            return ema;
        }

        function calculateRSI(prices, period) {
            if (prices.length <= period) return 50;
            let gains = 0, losses = 0;
            for (let i = 1; i <= period; i++) {
                let diff = prices[i] - prices[i - 1];
                if (diff >= 0) gains += diff; else losses -= diff;
            }
            let avgGain = gains / period, avgLoss = losses / period;
            for (let i = period + 1; i < prices.length; i++) {
                let diff = prices[i] - prices[i - 1];
                if (diff >= 0) { avgGain = (avgGain * (period - 1) + diff) / period; avgLoss = (avgLoss * (period - 1)) / period; }
                else { avgGain = (avgGain * (period - 1)) / period; avgLoss = (avgLoss * (period - 1) - diff) / period; }
            }
            return avgLoss === 0 ? 100 : 100 - (100 / (1 + (avgGain / avgLoss)));
        }

        async function fetchKlines(symbol, timeframe) {
            try {
                const response = await fetch(`https://bybit.com{symbol}&interval=${timeframe}&limit=50`);
                const data = await response.json();
                if (data.retCode === 0 && data.result && data.result.list) {
                    return data.result.list.map(item => parseFloat(item[4])).reverse();
                }
            } catch (e) { console.error(e); }
            return null;
        }

        async function startScanning() {
            if (!isScanning) return;
            const tf = document.getElementById('timeframe').value;
            const rsiP = parseInt(document.getElementById('rsi-period').value);
            const emaF = parseInt(document.getElementById('ema-fast').value);
            const emaS = parseInt(document.getElementById('ema-slow').value);
            
            document.getElementById('stats-total').innerText = USDT_PAIRS.length;
            let scanned = 0;

            for (const symbol of USDT_PAIRS) {
                if (!isScanning) break;
                const prices = await fetchKlines(symbol, tf);
                if (prices && prices.length > emaS) {
                    const price = prices[prices.length - 1];
                    const rsi = calculateRSI(prices, rsiP);
                    const eFast = calculateEMA(prices, emaF);
                    const eSlow = calculateEMA(prices, emaS);
                    
                    let dir = null, status = "Нейтрально";
                    if (eFast > eSlow && rsi < 40) { dir = "BUY"; status = "Бычий тренд"; }
                    else if (eFast < eSlow && rsi > 60) { dir = "SELL"; status = "Медвежий тренд"; }

                    if (dir) {
                        document.getElementById('empty-state').style.display = 'none';
                        const row = document.createElement('tr');
                        row.innerHTML = `<td>${new Date().toLocaleTimeString()}</td><td>${symbol}</td><td><span class="${dir==='BUY'?'side-buy':'side-sell'}">${dir}</span></td><td>${price}</td><td>${rsi.toFixed(1)}</td><td>${status}</td>`;
                        document.getElementById('signals-table-body').insertBefore(row, document.getElementById('signals-table-body').firstChild);
                    }
                }
                scanned++;
                document.getElementById('stats-scanned').innerText = scanned;
                await new Promise(r => setTimeout(r, 150));
            }
            document.getElementById('stats-signals').innerText = document.getElementById('signals-table-body').children.length;
            if (isScanning) setTimeout(startScanning, 15000);
        }

        function toggleScanner() {
            const btn = document.getElementById('btn-action');
            if (isScanning) {
                isScanning = false;
                btn.innerText = "Сканировать рынок";
                btn.style.backgroundColor = "#f7a600";
            } else {
                isScanning = true;
                btn.innerText = "Остановить";
                btn.style.backgroundColor = "#ff3b30";
                startScanning();
            }
        }
    </script>
</body>
</html>
