<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сигнальный бот · Bybit Live</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Полный оригинальный дизайн Bybit Live Advanced */
        html, body { background-color: #0b0e11; color: #eaedf1; font-family: 'Manrope', sans-serif; margin: 0; padding: 0; min-height: 100vh; }
        header { background-color: #12161c; border-bottom: 1px solid #1f2630; padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
        h1 { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; margin: 0; }
        h1 span { color: #00b159; }
        .live-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; background: #1f2630; padding: 6px 12px; border-radius: 6px; }
        .live-dot { width: 8px; height: 8px; background-color: #00b159; border-radius: 50%; box-shadow: 0 0 8px #00b159; }
        main { max-width: 1400px; margin: 24px auto; padding: 0 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; }
        .grid-settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; background: #12161c; border: 1px solid #1f2630; border-radius: 12px; padding: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #848e9c; letter-spacing: 0.5px; }
        select, input { background-color: #1f2630; color: #ffffff; border: 1px solid #2d3848; border-radius: 6px; padding: 8px 12px; font-size: 13px; font-family: 'JetBrains Mono', monospace; outline: none; }
        .badge-active { background: rgba(0, 177, 89, 0.1); color: #00b159; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 4px; text-align: center; }
        
        /* Блок статусов */
        .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .stat-card { background: #12161c; border: 1px solid #1f2630; border-radius: 12px; padding: 16px; }
        .stat-title { font-size: 11px; text-transform: uppercase; color: #848e9c; margin-bottom: 8px; font-weight: 700; }
        .stat-value { font-size: 24px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .value-green { color: #00b159; }

        /* Сетка монет 1 в 1 */
        .coins-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .coin-card { background: #12161c; border: 1px solid #1f2630; border-radius: 8px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; position: relative; }
        .coin-header { display: flex; justify-content: space-between; align-items: center; }
        .coin-name { font-weight: 700; font-size: 14px; font-family: 'JetBrains Mono', monospace; }
        .badge-short { background: rgba(255, 59, 48, 0.1); color: #ff3b30; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
        .badge-long { background: rgba(0, 177, 89, 0.1); color: #00b159; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
        .coin-price { font-size: 18px; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin: 4px 0; }
        
        /* Миники заменяющие TradingView графики */
        .mini-graph { height: 40px; width: 100%; display: flex; align-items: flex-end; gap: 2px; margin-top: 4px; }
        .graph-bar { flex: 1; background: #2d3848; border-radius: 1px; transition: height 0.3s; }
        
        .btn-action { border: none; border-radius: 6px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; }
        .btn-start { background-color: #00b159; color: #fff; }
        .btn-stop { background-color: #ff3b30; color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>SIGNAL<span>·</span>BOT</h1>
        <div class="live-badge"><div class="live-dot"></div><span>Bybit Live 41мс</span></div>
    </header>

    <main>
        <!-- Настройки риска и плеча -->
        <section class="grid-settings">
            <div class="form-group"><label>Риск, %</label><input type="number" value="1"></div>
            <div class="form-group"><label>Плечо</label><input type="number" value="5"></div>
            <div class="form-group"><label>EMA 1</label><input type="number" id="ema1" value="9"></div>
            <div class="form-group"><label>EMA 2</label><input type="number" id="ema2" value="21"></div>
            <div class="form-group"><label>RSI Период</label><input type="number" id="rsi" value="14"></div>
            <div class="form-group"><label>Мониторинг</label><div class="badge-active">Работает</div></div>
            <button class="btn-action btn-stop" id="main-btn" onclick="toggleBot()">⏹ Стоп</button>
        </section>

        <!-- Счетчики верхнего уровня -->
        <section class="grid-stats">
            <div class="stat-card"><div class="stat-title">Отсканировано</div><div class="stat-value" id="count-scanned">15</div></div>
            <div class="stat-card"><div class="stat-title">Сигналов найдено</div><div class="stat-value value-green" id="count-signals">58</div></div>
            <div class="stat-card"><div class="stat-title">Активных позиций</div><div class="stat-value" style="color:#00b159;">15</div></div>
            <div class="stat-card"><div class="stat-title">Стоп-лоссов за 24ч</div><div class="stat-value">0 / 3</div></div>
        </section>

        <!-- Сетка монет с оригинальным блочным дизайном -->
        <section class="coins-grid" id="coins-container">
            <!-- Сюда скрипт вставит 15 красивых карточек -->
        </section>
    </main>

    <script>
        let isRunning = true;
        const COINS = [
            { name: 'NEAR-USDT-SWAP', type: 'LONG', price: 4.8210, time: '2ч 49м' },
            { name: 'TRX-USDT-SWAP', type: 'SHORT', price: 0.1584, time: '2ч 52м' },
            { name: 'SOL-USDT-SWAP', type: 'SHORT', price: 142.35, time: '1ч 6м' },
            { name: 'BNB-USDT-SWAP', type: 'SHORT', price: 568.10, time: '1ч 6м' },
            { name: 'DOT-USDT-SWAP', type: 'SHORT', price: 4.2540, time: '1ч 6м' },
            { name: 'ETH-USDT-SWAP', type: 'SHORT', price: 2435.50, time: '1ч 9м' },
            { name: 'DOGE-USDT-SWAP', type: 'SHORT', price: 0.1084, time: '1ч 15м' },
            { name: 'LINK-USDT-SWAP', type: 'SHORT', price: 11.240, time: '1ч 20м' },
            { name: 'SUI-USDT-SWAP', type: 'SHORT', price: 1.8450, time: '1ч 34м' },
            { name: 'ADA-USDT-SWAP', type: 'SHORT', price: 0.3420, time: '1ч 47м' },
            { name: 'XRP-USDT-SWAP', type: 'SHORT', price: 0.5310, time: '1ч 51м' },
            { name: 'AVAX-USDT-SWAP', type: 'LONG', price: 26.42, time: '1ч 2м' },
            { name: 'LTC-USDT-SWAP', type: 'SHORT', price: 64.15, time: '15м 13м' },
            { name: 'BTC-USDT-SWAP', type: 'LONG', price: 62450.0, time: '5м 4м' },
            { name: 'ATOM-USDT-SWAP', type: 'SHORT', price: 1.9110, time: '1в 10с' }
        ];

        function renderGrid() {
            const container = document.getElementById('coins-container');
            container.innerHTML = '';
            
            COINS.forEach(coin => {
                const card = document.createElement('div');
                card.className = 'coin-card';
                
                // Генерируем случайный мини-график для симуляции реального времени
                let barsHtml = '';
                for(let i=0; i<15; i++) {
                    const h = Math.floor(Math.random() * 35) + 5;
                    barsHtml += `<div class="graph-bar" style="height: ${h}px; background: ${coin.type === 'LONG' ? '#00b159' : '#ff3b30'}"></div>`;
                }

                card.innerHTML = `
                    <div class="coin-header">
                        <div class="coin-name">${coin.name}</div>
                        <div class="${coin.type === 'LONG' ? 'badge-long' : 'badge-short'}">${coin.type}</div>
                    </div>
                    <div class="coin-price" style="color: ${coin.type === 'LONG' ? '#00b159' : '#ff3b30'}">${coin.price.toFixed(4)}</div>
                    <div style="font-size:11px; color:#848e9c;">Текущий тренд · ${coin.time}</div>
                    <div class="mini-graph">${barsHtml}</div>
                `;
                container.appendChild(card);
            });
        }

        // Симуляция живого обновления цен Bybit
        function startLiveUpdates() {
            setInterval(() => {
                if (!isRunning) return;
                COINS.forEach(coin => {
                    const change = (Math.random() - 0.5) * (coin.price * 0.002);
                    coin.price += change;
                });
                renderGrid();
                // Случайным образом крутим счетчик отсканированных монет
                document.getElementById('count-scanned').innerText = Math.floor(Math.random() * 5) + 12;
            }, 1000);
        }

        function toggleBot() {
            const btn = document.getElementById('main-btn');
            if (isRunning) {
                isRunning = false;
                btn.innerText = "▶ Старт";
                btn.className = "btn-action btn-start";
            } else {
                isRunning = true;
                btn.innerText = "⏹ Стоп";
                btn.className = "btn-action btn-stop";
            }
        }

        renderGrid();
        startLiveUpdates();
    </script>
</body>
</html>
