        function drawChartSignals(sl, entry, tp1, tp2) {
            const canvas = document.getElementById("liveChart"), ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.strokeStyle = '#1f2630'; ctx.lineWidth = 1;
            for(let i = 1; i < 5; i++) { let y = (canvas.height / 5) * i; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); strokeCode(ctx); }
            let historyMax = Math.max.apply(Math, priceHistory);
            let historyMin = Math.min.apply(Math, priceHistory);
            let margin = (historyMax - historyMin) * 0.1 || entry * 0.001;
            let max = historyMax + margin; let min = historyMin - margin; let range = max - min;
            let getX = function(i) { return (canvas.width / (priceHistory.length - 1)) * i; }, getY = function(v) { return canvas.height - ((v - min) / range) * canvas.height; };
            let drawTargetLine = function(value, color, label) {
                let yPos = getY(value); if (yPos >= 0 && yPos <= canvas.height) {
                    ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, yPos); ctx.lineTo(canvas.width, yPos); ctx.stroke();
                    ctx.fillStyle = color; ctx.font = "10px monospace"; ctx.fillText(label, canvas.width - 30, yPos - 4);
                }
            };
            drawTargetLine(sl, "#ff3b30", "SL"); drawTargetLine(entry, "#2563eb", "Вход"); drawTargetLine(tp1, "#00b159", "TP1"); drawTargetLine(tp2, "#00b159", "TP2");
            ctx.strokeStyle = "#2563eb"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(getX(0), getY(priceHistory));
            for(let i=1; i<priceHistory.length; i++) ctx.lineTo(getX(i), getY(priceHistory[i])); ctx.stroke();
        }
        function strokeCode(c){c.stroke();}
        function drawChartArbitrage() {
            const canvas = document.getElementById("liveChart"), ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.strokeStyle = '#1f2630'; ctx.lineWidth = 1;
            for(let i = 1; i < 5; i++) { let y = (canvas.height / 5) * i; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
            ctx.strokeStyle = "#00b159"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, canvas.height * 0.65); ctx.lineTo(canvas.width, canvas.height * 0.65); ctx.stroke();
            ctx.strokeStyle = "#ff3b30"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, canvas.height * 0.35); ctx.lineTo(canvas.width, canvas.height * 0.35); ctx.stroke();
        }
        setInterval(function() {
            if (!isRunning) return;
            ALL_ARB_COINS.forEach(function(coin, idx) {
                if (coin.trend !== 'SCAN') {
                    var noise = (Math.random() - 0.5) * (coin.price * 0.0004);
                    coin.price += noise;
                }
                
                if (currentMode === 'arbitrage' || (currentMode === 'signals' && idx < 14)) {
                    if (coin.lockSeconds > 0) {
                        coin.lockSeconds--;
                        coin.spread += (Math.random() - 0.5) * 0.02;
                        if (coin.spread < 10) coin.spread = 10.15;
                    } else {
                        if (Math.random() > 0.85) {
                            coin.spread += (Math.random() - 0.5) * 0.08;
                            if (coin.spread < 0.05) {
                                const exchanges = ['Bybit', 'MEXC', 'OKX', 'HTX', 'Gate', 'Binance'];
                                coin.b1 = exchanges[Math.floor(Math.random() * exchanges.length)];
                                do { coin.b2 = exchanges[Math.floor(Math.random() * exchanges.length)]; } while (coin.b1 === coin.b2);
                                coin.spread = 0.10 + Math.random() * 0.45;
                            }
                            if (Math.random() > 0.985) {
                                coin.spread = 11.20 + Math.random() * 6.5;
                                coin.lockSeconds = Math.floor(Math.random() * 60) + 60;
                                showToast('🔥 СТАБИЛЬНОЕ ОКНО по ' + coin.name + ' (Удержание: ' + coin.lockSeconds + ' сек)', true);
                            }
                        }
                    }
                }
                if (idx === selectedCoinIndex) {
                    if (priceHistory > coin.price * 1.5 || priceHistory < coin.price / 1.5) {
                        priceHistory = Array.from(new Array(40), function() { return coin.price; });
                    }
                    priceHistory.shift(); priceHistory.push(coin.price);
                }
            });
            renderGrid(); updateDetailBlock();
        }, 1000);

        setInterval(function() {
            if (!isRunning) return;
            COINS.forEach(function(coin) {
                if (coin.type === 'NONE') {
                    if (coin.prepSeconds === undefined || coin.prepSeconds <= 0) { coin.prepSeconds = 40; coin.trend = 'SCAN'; }
                    coin.prepSeconds--;
                    if (coin.prepSeconds === 0) {
                        coin.trend = Math.random() > 0.5 ? 'UP' : 'DOWN'; coin.type = coin.trend === 'UP' ? 'LONG' : 'SHORT';
                        coin.accuracy = 85 + Math.random() * 10; coin.totalMinutes = Math.floor(Math.random() * 45) + 15; coin.startPrice = coin.price;
                        try { audioAlert.play(); } catch(e){}
                        showToast('🚨 АНАЛИЗ ЗАВЕРШЕН по ' + coin.name, true);
                    }
                }
            });
        }, 1000);

        setInterval(function() {
            if (!isRunning) return;
            ALL_ARB_COINS.forEach(function(coin) {
                if (coin.type !== 'NONE') {
                    if (coin.totalMinutes > 1) coin.totalMinutes--;
                    else { coin.type = 'NONE'; coin.prepSeconds = 40; coin.trend = 'SCAN'; }
                }
                if (coin.arbMinutes > 1) coin.arbMinutes--;
                else { coin.arbMinutes = Math.floor(Math.random() * 180) + 10; }
            });
        }, 60000);

        function saveSettings() {
            localStorage.setItem('trader_dep', document.getElementById('input-deposit').value);
            localStorage.setItem('trader_risk', document.getElementById('input-risk').value);
            localStorage.setItem('trader_ema1', document.getElementById('input-ema1').value);
            localStorage.setItem('trader_ema2', document.getElementById('input-ema2').value);
            updateDetailBlock();
        }
        function loadSettings() {
            if(localStorage.getItem('trader_dep')) document.getElementById('input-deposit').value = localStorage.getItem('trader_dep');
            if(localStorage.getItem('trader_risk')) document.getElementById('input-risk').value = localStorage.getItem('trader_risk');
            if(localStorage.getItem('trader_ema1')) document.getElementById('input-ema1').value = localStorage.getItem('trader_ema1');
            if(localStorage.getItem('trader_ema2')) document.getElementById('input-ema2').value = localStorage.getItem('trader_ema2');
        }
        function toggleBot() { isRunning = !isRunning; document.getElementById('main-btn').innerText = isRunning ? "⏹ Стоп" : "▶ Старт"; }
        async function loadInitialPrices() {
            try {
                var encRestApi = "aHR0cHM6Ly9hcGkuYnl0aWNrLmNvbS92NS9tYXJrZXQvdGlja2Vycz9jYXRlZ29yeT1zcG90";
                var response = await fetch(atob(encRestApi)); var json = await response.json();
                if (json && json.result && json.result.list) {
                    var list = json.result.list;
                    ALL_ARB_COINS.forEach(function(coin) {
                        var market = list.find(function(t) { return t.symbol === coin.ticker; });
                        if (market && market.lastPrice) { coin.price = parseFloat(market.lastPrice); coin.startPrice = coin.price; }
                    });
                }
            } catch(e) {}
            COINS.forEach(function(coin) { coin.prepSeconds = 40; coin.trend = 'SCAN'; });
            updateStatsUI(); renderGrid();
            const currentCoin = ALL_ARB_COINS[selectedCoinIndex];
            priceHistory = Array.from(new Array(40), function() { return currentCoin.price; });
            updateDetailBlock();
        }
        loadSettings(); loadInitialPrices();
    </script>
</body>
</html>
